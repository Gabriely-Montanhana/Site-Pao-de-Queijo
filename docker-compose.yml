services:
  db:
    image: mysql:8.0
    container_name: banepane_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: senhadificilpradedeu123
      MYSQL_DATABASE: banepane
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-psenhadificilpradedeu123"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - rede-interna

  backend:
    build: ./back_end
    container_name: banepane_backend
    restart: always
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: banepane
      DB_USER: root
      DB_PASSWORD: senhadificilpradedeu123
      JWT_SECRET: banepane-docker-jwt
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rede-interna

  frontend:
    build: ./front_end
    container_name: banepane_frontend
    restart: always
    environment:
      VITE_API_URL: http://localhost
    networks:
      - rede-externa

  nginx:
    image: nginx:alpine
    container_name: banepane_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - rede-interna
      - rede-externa

networks:
  rede-externa:
    driver: bridge
  rede-interna:
    driver: bridge

volumes:
  db_data:
